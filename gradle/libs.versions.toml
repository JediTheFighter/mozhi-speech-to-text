espresso = "3.6.1"
coreKtx = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"
splashscreen = "1.0.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
